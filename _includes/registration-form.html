<!-- PAGAMENTO GRANDE DESAFIO 2026 -->

<script>
function realizaPagamento(event) {

    // Impede o envio imediato
    event.preventDefault();

    const camposObrigatorios = [
        { id: "equipe", nome: "Nome da Equipe" },
        { id: "trilha", nome: "Trilha" },
        { id: "nomeparticipante", nome: "Nome Completo" },
        { id: "numerodocumento", nome: "Número do Documento" },
        { id: "cep", nome: "CEP" },
        { id: "endereco", nome: "Endereço" },
        { id: "numero", nome: "Número" },
        { id: "bairro", nome: "Bairro" },
        { id: "cidade", nome: "Cidade" },
        { id: "uf", nome: "Estado" },
        { id: "celular", nome: "Celular" },
        { id: "email", nome: "E-mail" },
        { id: "formapagamento", nome: "Forma de Pagamento" },
        { id: "valor", nome: "Valor" }
    ];

    const mensagemErro = document.getElementById("mensagem-erro");

    mensagemErro.innerHTML = "";

    // Verifica os campos obrigatórios
    for (const campoInfo of camposObrigatorios) {

        const campo = document.getElementById(campoInfo.id);

        if (!campo || campo.value.trim() === "") {

            mensagemErro.innerHTML =
                "O campo " + campoInfo.nome + " é obrigatório.";

            if (campo) {
                campo.focus();
            }

            return false;
        }
    }

    // --------------------------------------------------------
    // GERA NÚMERO ÚNICO PARA O PEDIDO
    // --------------------------------------------------------

    const agora = new Date();

    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, "0");
    const dia = String(agora.getDate()).padStart(2, "0");
    const hora = String(agora.getHours()).padStart(2, "0");
    const minuto = String(agora.getMinutes()).padStart(2, "0");
    const segundo = String(agora.getSeconds()).padStart(2, "0");

    const aleatorio = Math.floor(1000 + Math.random() * 9000);

    const numeroPedido =
        ano +
        mes +
        dia +
        hora +
        minuto +
        segundo +
        aleatorio;

    document.getElementById("numeropedido").value = numeroPedido;


    // --------------------------------------------------------
    // NOME QUE SERÁ ENVIADO PARA A FUNCAMP
    // --------------------------------------------------------

    document.getElementById("nome").value =
        document.getElementById("nomeparticipante").value +
        " - " +
        document.getElementById("equipe").value +
        " - " +
        document.getElementById("trilha").value;


    // --------------------------------------------------------
    // DESCRIÇÃO QUE SERÁ ENVIADA PARA A FUNCAMP
    // --------------------------------------------------------

    document.getElementById("descricao").value =
        "Inscrição no Grande Desafio 2026 da equipe: " +
        document.getElementById("equipe").value +
        " na " +
        document.getElementById("trilha").value;


    // --------------------------------------------------------
    // ENVIA O FORMULÁRIO
    // --------------------------------------------------------

    document.getElementById("formulario-pagamento").submit();
}
</script>
